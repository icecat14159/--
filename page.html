<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8">
    <title>海盜棋模擬網站</title>
    <link rel="stylesheet" href="style.css"> <!-- 導入樣式表 -->
  </head>
  <body>
    <!-- 側邊欄開關按鈕 -->
    <button id="menu-toggle" onclick="toggleSidebar()">✕</button>

    <!-- 側邊欄外層容器 -->
    <div id="ui-sidebar" class="sidebar-open">
      <div id="ui-panel">
        <!-- 分頁切換按鈕 -->
        <div id="sidebar-tabs"> 
          <button class="tab-btn active" onclick="switchTab('selector')">公會列表</button>
          <button class="tab-btn" onclick="switchTab('leaderboard')">設施統計</button>
        </div>

        <!-- 公會列表與操作面板 -->
        <div id="tool-panel"> 
          <!-- 筆刷佔領設定區 -->
          <div class="tool-section">
            <div style="display: flex; gap: 6px; align-items: center;">
              <button id="quick-fill-toggle" onclick="toggleQuickFill()">筆刷佔領：OFF</button>
              <button id="reset-guild-btn" onclick="clearCurrentGuildTerritory()" title="一鍵清除目前選中公會的所有佔領海域">清除海域</button>
            </div>
            
            <div id="brush-control-panel" style="margin-top: 8px;">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
                <span style="color: #ccc; font-size: 13px;">筆刷大小：<strong id="brush-size-display" style="color: #4db8ff;">1 格</strong></span>
              </div>
              <div class="brush-size-buttons">
                <button class="brush-size-btn active" data-size="1" onclick="setBrushSize(1)" title="單格 (半徑 0)">1格</button>
                <button class="brush-size-btn" data-size="2" onclick="setBrushSize(2)" title="小範圍 (半徑 1，共7格)">7格</button>
                <button class="brush-size-btn" data-size="3" onclick="setBrushSize(3)" title="中範圍 (半徑 2，共19格)">19格</button>
                <button class="brush-size-btn" data-size="4" onclick="setBrushSize(4)" title="大範圍 (半徑 3，共37格)">37格</button>
              </div>
              <input type="range" id="brush-size-slider" min="1" max="4" value="1" step="1" oninput="setBrushSize(parseInt(this.value))">
            </div>
          </div>

          <!-- 地標顯示控制 -->
          <div style="margin-top: 10px;">
            <button id="landmark-toggle" onclick="toggleLandmarks()">隱藏地標：OFF</button>
          </div>

          <!-- 地圖開放階段 -->
          <div style="margin-top: 10px; border-top: 1px solid #555; padding-top: 8px;">
            <span style="color: white; font-size: 14px;">地圖階段：</span><br>
            <div style="margin-top: 5px;">
              <button class="phase-btn active" onclick="setPhase(1)">第一天</button>
              <button class="phase-btn" onclick="setPhase(2)">第二天</button>
              <button class="phase-btn" onclick="setPhase(3)">第三天</button>
            </div>
          </div>

          <!-- 戰術標記功能 -->
          <div style="margin-top: 10px; border-top: 1px solid #555; padding-top: 8px;">
            <span style="color: white; font-size: 14px;">戰術標記：</span><br>
            
            <div style="display: flex; gap: 5px; margin-top: 5px;">
              <button class="marker-btn attack" onclick="selectMarkerTool('attack')" title="進攻">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="white"><path d="M 4 21 L 2 19 L 4 17 L 1 14 L 3 12 L 6 15 L 18 3 L 20 3 L 20 5 L 8 17 L 11 20 L 9 22 L 6 19 Z M 6 3 L 4 3 L 4 5 L 10 11 L 12 9 Z M 12 13 L 16 17 L 13 20 L 15 22 L 18 19 L 20 21 L 22 19 L 20 17 L 23 14 L 21 12 L 18 15 L 14 11 Z"/></svg>
              </button>
              <button class="marker-btn defend" onclick="selectMarkerTool('defend')" title="防守">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="white"><path d="M12,1L3,5v6c0,5.55,3.84,10.74,9,12c5.16-1.26,9-6.45,9-12V5L12,1z M12,11.99h7c-0.53,4.12-3.28,7.79-7,8.94V12H5V6.3 l7-3.11V11.99z"/></svg>
              </button>
              <button class="marker-btn ban" onclick="selectMarkerTool('ban')" title="禁止">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="white"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8 0-1.84.62-3.54 1.66-4.92L16.92 18.34C15.54 19.38 13.84 20 12 20zm8-8c0 1.84-.62 3.54-1.66 4.92L7.08 5.66C8.46 4.62 10.16 4 12 4c4.41 0 8 3.59 8 8z"/></svg>
              </button>
              <button class="marker-btn warn" onclick="selectMarkerTool('warn')" title="注意">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="white"><path d="M1,21h22L12,2L1,21z M13,18h-2v-2h2V18z M13,14h-2v-4h2V14z"/></svg>
              </button>
              <button class="marker-btn clear" onclick="selectMarkerTool('clear')" title="清除標記"></button>
            </div>

            <div style="margin-top: 5px; display: flex; align-items: center;">
              <span style="color: #ccc; font-size: 12px; margin-right: 5px;">數值(億):</span>
              <input type="number" id="marker-value" placeholder="選填" oninput="updateMarkerValue(this.value)" style="width: 60px; background: #333; color: white; border: 1px solid #555; border-radius: 3px; padding: 2px 4px;">
            </div>
            <div id="marker-status" style="color: #aaa; font-size: 12px; margin-top: 4px;">目前模式：無</div>
          </div>
        </div>

        <!-- 公會清單列表 -->
        <div id="guild-selector" class="tab-content active"></div>

        <!-- 設施統計面板 -->
        <div id="leaderboard-panel" class="tab-content"></div>
      </div>
    </div>

    <!-- 編輯公會資訊視窗 -->
    <div id="edit-modal" style="display: none;">
      <div class="modal-content">
        <h4>編輯公會資訊</h4>
        <label>名稱：<input type="text" id="edit-name"></label><br><br>
        <label>建議顏色：</label>
        <div id="swatch-container"></div>
        <label>自定義顏色：<input type="color" id="edit-color"></label><br><br>
        <div style="display: flex; gap: 8px; justify-content: flex-end; margin-top: 15px;">
          <button class="modal-btn danger" onclick="clearGuildTerritoryFromModal()">清除此公會海域</button>
          <button class="modal-btn primary" onclick="saveGuildEdit()">儲存</button>
          <button class="modal-btn" onclick="closeModal()">取消</button>
        </div>
      </div>
    </div>

    <!-- 主地圖 SVG -->
    <svg id="hexMap">
      <defs>
        <pattern id="hatchPattern" patternUnits="userSpaceOnUse" width="10" height="10">
          <path d="M 0,10 l 10,-10 M -2,2 l 4,-4 M 8,12 l 4,-4" 
                stroke="#222" stroke-width="3" opacity="0.7"/>
        </pattern>
      </defs>

      <g id="viewport">
        <image id="map-background" href="map-bg.jpg" x="0" y="0"></image> <!-- 底圖 -->
        <g id="feature-image-layer"></g> <!-- 設施與公會船底圖圖層 -->
        <g id="grid-layer"></g> <!-- 六角棋盤網格圖層 -->
        <g id="restriction-layer"></g> <!-- 禁區遮罩圖層 -->
        <g id="effect-layer"></g> <!-- 特效與邊界圖層 -->
        <g id="territory-label-layer"></g> <!-- 公會據點與最大海域勢力標籤圖層 -->
        <g id="mark-layer"></g> <!-- 戰術標記圖層 -->
      </g>
    </svg>

    <!-- 腳本引入 -->
    <script src="config.js"></script>
    <script src="guildUI.js"></script>
    <script src="logic.js"></script>
    <script src="hex.js"></script>
  </body>
</html>
